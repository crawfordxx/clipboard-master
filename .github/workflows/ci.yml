name: CI
on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS (swift test)
    runs-on: macos-14
    env:
      # Swift Testing requires the Swift 6 toolchain bundled with Xcode 16.
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  windows:
    name: Windows (dotnet test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test windows/ClipboardMaster.Core.Tests
      - name: Build tray app
        run: dotnet build windows/ClipboardMaster.App -c Release

  promo:
    name: Promo (timeline and types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promo/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
